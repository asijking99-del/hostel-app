<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hostel Manager - Admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2D4F4A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F2F3F2;--card:#FFFFFF;--text:#1B1F1E;--muted:#68706E;--pri:#2D4F4A;--on:#FFFFFF;--ok:#3E7A5A;--bad:#B3443A;--warn:#A9741A;--line:#E1E4E2;--tint:#E9EEEC}
@media (prefers-color-scheme:dark){:root{--bg:#101312;--card:#171B1A;--text:#E6E9E7;--muted:#8D9795;--pri:#8FB9AE;--on:#0E1513;--ok:#7DBB98;--bad:#E07F74;--warn:#D9A64E;--line:#262C2B;--tint:#1E2423}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
h2{font-size:15px;font-weight:700;margin:0 0 10px}
a{color:var(--pri)}
.muted{color:var(--muted);font-size:13px}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input,select{width:100%;height:42px;padding:0 12px;margin:4px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
button{height:36px;padding:0 14px;border:1px solid var(--pri);border-radius:8px;background:var(--pri);color:var(--on);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
button.l{background:transparent;color:var(--text);border-color:var(--line)}
button.g{background:transparent;color:var(--ok);border-color:var(--ok)}
button.r{background:transparent;color:var(--bad);border-color:transparent}
button:active{transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:120px}.row>button{flex:0 0 auto;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--tint)}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.p,.tag.e{color:var(--bad)}.tag.d,.tag.a{color:var(--ok)}.tag.s{color:var(--warn)}

.wrap{max-width:900px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.stats div{padding:12px 4px;color:var(--muted);font-size:13px}
.stats b{display:block;font-size:26px;font-weight:800;color:var(--text);letter-spacing:-.02em}
.h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap" id="app">Loading...</div>
<script>
const sb = supabase.createClient("https://gksshbrrlkhiuxedgahw.supabase.co", "sb_publishable_97rSi16zxVjtkuhjopOyeg_BaSevqH_");
const app = document.getElementById("app");
let rows = [], q = "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val = id => document.getElementById(id).value.trim();
const fmt = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = () => fmt(new Date());

async function start(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return showAuth();
  const { data:ok } = await sb.rpc("is_admin");
  if(!ok) return app.innerHTML = `<div class="card"><h1>Not an admin</h1><p class="muted">This account does not have admin access.</p><button class="l" onclick="logout()">Sign out</button></div>`;
  await load(); render();
}
function showAuth(msg=""){
  app.innerHTML = `<div class="card" style="max-width:400px;margin:40px auto"><h1>Admin sign in</h1><br>
  <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password">
  <p style="color:var(--bad)">${esc(msg)}</p><button onclick="login()">Sign in</button></div>`;
}
async function login(){
  const { error } = await sb.auth.signInWithPassword({ email:val("em"), password:val("pw") });
  error ? showAuth(error.message) : start();
}
async function logout(){ await sb.auth.signOut(); showAuth(); }
async function load(){ const { data, error } = await sb.rpc("admin_hostels"); if(error) alert(error.message); rows = data || []; }

function status(r){
  const t = today();
  if(!r.paid_until || r.paid_until < t) return ["Expired","e"];
  const days = Math.ceil((new Date(r.paid_until) - new Date(t)) / 86400000);
  return days <= 7 ? ["Ends in "+days+"d","s"] : ["Active","a"];
}
function render(){
  const t = today();
  const exp = rows.filter(r=>!r.paid_until || r.paid_until < t).length;
  const soon = rows.filter(r=>status(r)[1]=="s").length;
  const list = rows.filter(r=>(r.name+" "+r.owner_email).toLowerCase().includes(q.toLowerCase()));
  app.innerHTML = `<div class="top"><h1>Admin</h1><button class="l" onclick="logout()">Sign out</button></div>
  <div class="stats"><div><b>${rows.length}</b>Hostels</div><div><b>${rows.length-exp}</b>Active</div>
  <div><b>${soon}</b>Ending soon</div><div><b>${exp}</b>Expired</div></div>
  <input id="sq" placeholder="Search hostel or email" value="${esc(q)}" oninput="q=this.value;renderList()">
  <div id="list"></div>`;
  renderList();
}
function renderList(){
  const list = rows.filter(r=>(r.name+" "+r.owner_email).toLowerCase().includes(q.toLowerCase()));
  document.getElementById("list").innerHTML = list.map(r=>{
    const [label,cls] = status(r);
    return `<div class="card"><div class="h"><div><b>${esc(r.name)}</b> <span class="tag ${cls}">${label}</span>
    <div class="muted">${esc(r.owner_email)} | joined ${r.created_at.slice(0,10)}</div>
    <div class="muted">${r.students} students | Rs ${Number(r.pending).toLocaleString()} pending | paid until <b>${r.paid_until||"-"}</b></div>
    ${r.note?`<div class="muted">Note: ${esc(r.note)}</div>`:""}</div></div><br>
    <div class="row"><button onclick="extend('${r.hostel_id}',1)">+1 month</button><button onclick="extend('${r.hostel_id}',3)">+3 months</button>
    <button onclick="extend('${r.hostel_id}',12)">+12 months</button>
    <input type="date" id="d_${r.hostel_id}" style="width:150px"><button class="l" onclick="setDate('${r.hostel_id}')">Set date</button>
    <button class="l" onclick="setNote('${r.hostel_id}')">Note</button></div></div>`;
  }).join("") || '<p class="muted">No hostels found.</p>';
}
async function save(id, date, note){
  const { error } = await sb.rpc("admin_set_paid", { h:id, new_date:date, n:note });
  if(error) return alert(error.message);
  await load(); render();
}
function extend(id, months){
  const r = rows.find(x=>x.hostel_id==id);
  const base = (r.paid_until && r.paid_until > today()) ? new Date(r.paid_until+"T00:00:00") : new Date();
  base.setMonth(base.getMonth() + months);
  if(confirm("Set "+r.name+" paid until "+fmt(base)+"?")) save(id, fmt(base), null);
}
function setDate(id){ const d = document.getElementById("d_"+id).value; if(!d) return alert("Pick a date first"); save(id, d, null); }
function setNote(id){
  const r = rows.find(x=>x.hostel_id==id);
  const n = prompt("Note (e.g. paid via JazzCash, ref 12345):", r.note||""); if(n===null) return;
  save(id, r.paid_until || today(), n);
}
start();
setInterval(async () => {
  if(document.hidden || !document.getElementById("list")) return;
  const el = document.activeElement;
  if(el && el.tagName == "INPUT" && el.id != "sq") return;
  await load();
  el && el.id == "sq" ? renderList() : render();
}, 30000);
</script>
</body>
</html>
