<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hostel Manager</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2D4F4A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F2F3F2;--card:#FFFFFF;--text:#1B1F1E;--muted:#68706E;--pri:#2D4F4A;--on:#FFFFFF;--ok:#3E7A5A;--bad:#B3443A;--warn:#A9741A;--line:#E1E4E2;--tint:#E9EEEC}
@media (prefers-color-scheme:dark){:root{--bg:#101312;--card:#171B1A;--text:#E6E9E7;--muted:#8D9795;--pri:#8FB9AE;--on:#0E1513;--ok:#7DBB98;--bad:#E07F74;--warn:#D9A64E;--line:#262C2B;--tint:#1E2423}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
h2{font-size:15px;font-weight:700;margin:0 0 10px}
a{color:var(--pri)}
.muted{color:var(--muted);font-size:13px}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input,select{width:100%;height:42px;padding:0 12px;margin:4px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
button{height:36px;padding:0 14px;border:1px solid var(--pri);border-radius:8px;background:var(--pri);color:var(--on);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
button.l{background:transparent;color:var(--text);border-color:var(--line)}
button.g{background:transparent;color:var(--ok);border-color:var(--ok)}
button.r{background:transparent;color:var(--bad);border-color:transparent}
button:active{transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:120px}.row>button{flex:0 0 auto;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--tint)}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.p,.tag.e{color:var(--bad)}.tag.d,.tag.a{color:var(--ok)}.tag.s{color:var(--warn)}

#app{padding:0}
.side{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.side .brand,.side .foot{display:none}
.nav{display:flex;flex:1;gap:2px}
.nav button{flex:1;height:auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:600;border-radius:8px}
.nav button.on{color:var(--pri);background:var(--tint)}
.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.main{padding:14px 16px calc(92px + env(safe-area-inset-bottom,0px))}
.main>*{max-width:760px}
.mtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}.mtop b{flex:1;font-size:16px}
.hero{padding:4px 0 18px}
.hero .lbl{color:var(--muted);font-size:13px;font-weight:600}
.hero .fig{font-size:clamp(34px,9vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 14px}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pri);border-radius:99px}
.hero .sub{display:flex;gap:4px 18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:10px}
.seg{display:inline-flex;background:var(--tint);border-radius:9px;padding:3px;margin-bottom:14px}
.seg button{height:30px;border:0;background:transparent;color:var(--muted);border-radius:7px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--line)}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .5s ease}}
@media (min-width:800px){
 .side{top:0;right:auto;bottom:auto;width:232px;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:20px 14px}
 .side .brand{display:flex;align-items:center;gap:10px;margin:0 6px 24px;font-weight:800;font-size:16px;line-height:1.2}
 .side .foot{display:block;margin-top:auto}
 .nav{flex:0 0 auto;flex-direction:column}
 .nav button{flex-direction:row;gap:12px;font-size:14px;padding:10px 12px;justify-content:flex-start}
 .main{margin-left:232px;padding:30px 40px}
 .mtop{display:none}
}
</style>
</head>
<body>
<div id="app">Loading...</div>
<script>
const SUPABASE_URL = "https://gksshbrrlkhiuxedgahw.supabase.co";
const SUPABASE_KEY = "sb_publishable_97rSi16zxVjtkuhjopOyeg_BaSevqH_";
const ADMIN_WHATSAPP = "923001234567"; // CHANGE: your WhatsApp number, country code first, no + or spaces
const PRICE_TEXT = "Rs 2,000 per month";  // CHANGE: your price
let subUntil = null, locked = false;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app");
let hostel = null, students = [], dues = [], rooms = [], expenses = [], rmonth = new Date().toISOString().slice(0,7), tab = "pending", month = new Date().toISOString().slice(0,7);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val = id => document.getElementById(id).value.trim();

function waLink(phone, text){
  let p = String(phone||"").replace(/\D/g,"");
  if(p.startsWith("0")) p = "92" + p.slice(1); // Pakistan numbers; change 92 for other countries
  return "https://wa.me/" + p + "?text=" + encodeURIComponent(text);
}

async function start(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return showAuth();
  const { data } = await sb.from("hostels").select("*").limit(1);
  hostel = data && data[0];
  if(!hostel) return showSetup();
  await loadSub(); await load(); render(); listen();
}
async function loadSub(){
  const sub = await sb.from("subscriptions").select("*").eq("hostel_id", hostel.id).maybeSingle();
  subUntil = sub.data ? sub.data.paid_until : null;
  locked = !subUntil || subUntil < new Date().toISOString().slice(0,10);
}
function lockMsg(){ alert("Your subscription has expired. Please renew to make changes."); }
function banner(){
  if(!subUntil) return "";
  const days = Math.ceil((new Date(subUntil) - new Date(new Date().toISOString().slice(0,10))) / 86400000);
  const link = waLink(ADMIN_WHATSAPP, "Hello, I want to renew my hostel subscription for " + hostel.name + ".");
  if(locked) return `<div class="card" style="border-color:var(--bad)"><b style="color:var(--bad)">Subscription expired on ${subUntil}.</b>
  <div class="muted">You can view your data but cannot make changes. Renew: ${esc(PRICE_TEXT)}.</div><br><a href="${link}" target="_blank"><button>Renew on WhatsApp</button></a></div>`;
  if(days <= 7) return `<div class="card" style="border-color:var(--bad)"><b>${days} day(s) left</b> (until ${subUntil}).
  <a href="${link}" target="_blank">Renew on WhatsApp</a> | ${esc(PRICE_TEXT)}</div>`;
  return `<div class="muted" style="margin-bottom:8px">Subscription active until ${subUntil} (${days} days left)</div>`;
}

function showAuth(msg=""){
  app.innerHTML = `<div class="card" style="max-width:400px;width:calc(100% - 32px);margin:48px auto">
  ${LOGO}<h1 style="margin-top:12px">Hostel Manager</h1><p class="muted">Sign in, or create an account for your hostel.</p>
  <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (min 6 characters)">
  <p style="color:var(--bad)">${esc(msg)}</p>
  <div class="row"><button onclick="login()">Sign in</button><button class="l" onclick="signup()">Create account</button></div></div>`;
}
async function login(){
  const { error } = await sb.auth.signInWithPassword({ email:val("em"), password:val("pw") });
  error ? showAuth(error.message) : start();
}
async function signup(){
  const { data, error } = await sb.auth.signUp({ email:val("em"), password:val("pw") });
  if(error) return showAuth(error.message);
  data.session ? start() : showAuth("Account created. Now press Login.");
}
function showSetup(){
  app.innerHTML = `<div class="card" style="max-width:400px;width:calc(100% - 32px);margin:48px auto"><h1>Name your hostel</h1>
  <input id="hn" placeholder="Hostel name"><br><br><button onclick="createHostel()">Create</button></div>`;
}
async function createHostel(){
  const name = val("hn"); if(!name) return;
  const { error } = await sb.from("hostels").insert({ name });
  if(error) return alert(error.message);
  start();
}
async function logout(){ if(rt){ sb.removeChannel(rt); rt=null; } await sb.auth.signOut(); hostel=null; showAuth(); }

async function load(){
  const s = await sb.from("students").select("*").order("name");
  students = s.data || [];
  const d = await sb.from("dues").select("*, students(name,phone,room)").order("month",{ascending:false});
  dues = d.data || [];
  const r = await sb.from("rooms").select("*").order("name"); rooms = r.data || [];
  const e = await sb.from("expenses").select("*").order("spent_on",{ascending:false}); expenses = e.data || [];
}

const LOGO = '<svg viewBox="0 0 48 48" width="38" height="38" aria-hidden="true" style="flex:0 0 auto"><rect width="48" height="48" rx="11" fill="#2D4F4A"/><path d="M11.5 17.8 24 8.2l12.5 9.6" fill="none" stroke="#fff" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.6 21.6v16.8M32.4 21.6v16.8M15.6 29.8h16.8" stroke="#fff" stroke-width="3.3" stroke-linecap="round"/></svg>';
const ICON = {
  dues:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9.5 8.5h5M9.5 12.5h5"/>',
  students:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.3c1.8.8 3 2.6 3 4.7"/>',
  rooms:'<path d="M3 19V6M3 15h18v4M21 15v-2.5a2.5 2.5 0 0 0-2.5-2.5H11v5"/><circle cx="7" cy="11.5" r="1.6"/>',
  expenses:'<path d="M12 3v18"/><path d="M16.5 7.5c0-1.7-2-3-4.5-3S7.5 5.8 7.5 7.5 9.5 10.2 12 11s4.5 1.8 4.5 3.5-2 3-4.5 3-4.5-1.3-4.5-3"/>',
  report:'<path d="M5 20v-9M12 20V4M19 20v-6"/>'
};
const NAV = [["dues","Dues"],["students","Students"],["rooms","Rooms"],["expenses","Expenses"],["report","Report"]];
function curNav(){ return (tab=="pending"||tab=="all") ? "dues" : tab; }
function go(k){ tab = k=="dues" ? "pending" : k; render(); }
function hero(){
  const pend = dues.filter(d=>!d.paid);
  const cm = new Date().toISOString().slice(0,7);
  const md = dues.filter(d=>d.month==cm);
  const billed = sum(md.map(d=>d.amount)), got = sum(md.filter(d=>d.paid).map(d=>d.amount));
  const pct = billed ? Math.round(got/billed*100) : 0;
  const act = students.filter(s=>s.active).length;
  return `<section class="hero"><div class="lbl">Outstanding</div><div class="fig">${money(sum(pend.map(d=>d.amount)))}</div>
  ${billed ? `<div class="meter"><i style="width:${pct}%"></i></div><div class="sub"><span>${cm}: ${money(got)} of ${money(billed)} collected (${pct}%)</span><span>${pend.length} unpaid</span><span>${act} active students</span></div>`
  : `<div class="sub"><span>${pend.length} unpaid</span><span>${act} active students</span><span>No dues created for ${cm} yet.</span></div>`}</section>`;
}
function seg(){ return `<div class="seg"><button class="${tab=="pending"?"on":""}" onclick="tab='pending';render()">Pending</button><button class="${tab=="all"?"on":""}" onclick="tab='all';render()">All dues</button></div>`; }
function render(){
  const k = curNav();
  app.innerHTML = `<div class="shell"><nav class="side"><div class="brand">${LOGO}<span>${esc(hostel.name)}</span></div>
  <div class="nav">${NAV.map(([id,l])=>`<button class="${k==id?"on":""}" onclick="go('${id}')"><svg viewBox="0 0 24 24">${ICON[id]}</svg>${l}</button>`).join("")}</div>
  <div class="foot"><button class="l" onclick="logout()" style="width:100%">Sign out</button></div></nav>
  <main class="main"><div class="mtop">${LOGO}<b>${esc(hostel.name)}</b><button class="l" onclick="logout()">Sign out</button></div>
  ${banner()}<div id="body"></div></main></div>`;
  const b = document.getElementById("body");
  if(tab=="students") b.innerHTML = studentsView();
  else if(tab=="rooms") b.innerHTML = roomsView();
  else if(tab=="expenses") b.innerHTML = expensesView();
  else if(tab=="report") b.innerHTML = reportView();
  else b.innerHTML = hero() + seg() + duesView(tab=="pending");
}

function studentsView(){
  return `<div class="card"><h2>Add student</h2>
  <input id="sn" placeholder="Name"><input id="sp" placeholder="WhatsApp number (e.g. 03001234567)">
  <div class="row">${roomField()}<input id="sf" type="number" placeholder="Monthly fee"></div>
  <br><button onclick="addStudent()">Add</button></div>
  <div class="card"><h2>Students (${students.length})</h2>
  ${students.map(s=>`<div class="item"><div><b>${esc(s.name)}</b> ${s.active?"":'<span class="muted">(left)</span>'}
  <div class="muted">Room ${esc(s.room)} | ${esc(s.phone)} | Rs ${s.monthly_fee}</div></div>
  <div class="row"><button class="l" onclick="toggleActive('${s.id}',${!s.active})">${s.active?"Mark left":"Reactivate"}</button>
  <button class="r" onclick="delStudent('${s.id}')">Delete</button></div></div>`).join("") || '<p class="muted">No students yet. Add your first student above.</p>'}</div>`;
}
async function addStudent(){ if(locked) return lockMsg();
  const name = val("sn"); if(!name) return alert("Enter a name");
  const { error } = await sb.from("students").insert({ hostel_id:hostel.id, name, phone:val("sp"), room:val("sr"), monthly_fee:Number(val("sf"))||0 });
  if(error) return alert(error.message);
  await load(); render();
}
async function toggleActive(id, v){ if(locked) return lockMsg(); await sb.from("students").update({active:v}).eq("id",id); await load(); render(); }
async function delStudent(id){ if(locked) return lockMsg(); if(!confirm("Delete this student and all their dues?")) return; await sb.from("students").delete().eq("id",id); await load(); render(); }

function duesView(onlyPending){
  const list = onlyPending ? dues.filter(d=>!d.paid) : dues;
  return `<div class="card"><h2>Create dues for a month</h2><div class="row">
  <input id="mo" type="month" value="${month}"><button onclick="genDues()">Create dues</button></div></div>
  <div class="card"><h2>${onlyPending?"Pending dues":"All dues"} (${list.length})</h2>
  ${list.map(d=>`<div class="item"><div><b>${esc(d.students?.name)}</b> <span class="tag ${d.paid?"d":"p"}">${d.paid?"Paid":"Pending"}</span>
  <div class="muted">${d.month} | Room ${esc(d.students?.room)} | Rs ${d.amount}</div></div>
  <div class="row">${d.paid?`<button onclick="receipt('${d.id}')">Receipt</button><button class="l" onclick="setPaid('${d.id}',false)">Undo</button>`:
  `<button class="g" onclick="setPaid('${d.id}',true)">Mark paid</button>
  <button onclick="remind('${d.id}')">WhatsApp</button>`}</div></div>`).join("") || '<p class="muted">Nothing to show yet. Create dues for a month above.</p>'}</div>`;
}
async function genDues(){ if(locked) return lockMsg();
  month = val("mo"); if(!month) return;
  const have = new Set(dues.filter(d=>d.month==month).map(d=>d.student_id));
  const rows = students.filter(s=>s.active && s.monthly_fee>0 && !have.has(s.id))
    .map(s=>({ hostel_id:hostel.id, student_id:s.id, month, amount:s.monthly_fee }));
  if(!rows.length) return alert("No new dues to create for " + month);
  const { error } = await sb.from("dues").insert(rows);
  if(error) return alert(error.message);
  await load(); render();
}
async function setPaid(id, v){ if(locked) return lockMsg();
  if(v && confirm("Mark as paid and send a WhatsApp receipt?")) receipt(id, new Date().toISOString().slice(0,10));
  await sb.from("dues").update({ paid:v, paid_on: v ? new Date().toISOString().slice(0,10) : null }).eq("id",id);
  await load(); render();
}
function receipt(id, date){
  const d = dues.find(x=>x.id==id);
  if(!d.students?.phone) return alert("No phone number saved for this student");
  const msg = `*PAYMENT RECEIPT*\n${hostel.name}\n\nReceipt no: R-${d.id.slice(0,6).toUpperCase()}\nName: ${d.students.name}\nRoom: ${d.students.room || "-"}\nFor month: ${d.month}\nAmount received: Rs ${Number(d.amount).toLocaleString()}\nDate: ${date || d.paid_on}\nStatus: PAID\n\nThank you!`;
  window.open(waLink(d.students.phone, msg), "_blank");
}
function remind(id){
  const d = dues.find(x=>x.id==id);
  if(!d.students?.phone) return alert("No phone number saved for this student");
  const msg = `Assalam o Alaikum ${d.students.name}, this is a reminder from ${hostel.name}. Your hostel fee of Rs ${d.amount} for ${d.month} is pending. Please pay at your earliest. Thank you.`;
  window.open(waLink(d.students.phone, msg), "_blank");
}
const CATS = ["Electricity","Water","Food / Mess","Salaries","Repairs","Internet","Rent","Other"];
const sum = a => a.reduce((t,x)=>t+Number(x),0);
const money = n => "Rs " + Number(n).toLocaleString();
function roomField(){
  return rooms.length ? `<select id="sr"><option value="">Room (none)</option>${rooms.map(r=>`<option>${esc(r.name)}</option>`).join("")}</select>`
                      : `<input id="sr" placeholder="Room">`;
}
function monthPicker(){ return `<div class="card"><div class="row"><b style="flex:0 0 auto">Month</b><input type="month" value="${rmonth}" onchange="rmonth=this.value||rmonth;render()"></div></div>`; }

function roomsView(){
  return `<div class="card"><h2>Add room</h2><div class="row"><input id="rn" placeholder="Room name / number"><input id="rc" type="number" placeholder="Beds (capacity)"></div>
  <br><button onclick="addRoom()">Add room</button></div>
  <div class="card"><h2>Rooms (${rooms.length})</h2>
  ${rooms.map(r=>{ const n = students.filter(s=>s.active && s.room==r.name).length;
    return `<div class="item"><div><b>${esc(r.name)}</b> <span class="tag ${n>=r.capacity?"p":"d"}">${n}/${r.capacity} beds</span>
    <div class="muted">${students.filter(s=>s.active && s.room==r.name).map(s=>esc(s.name)).join(", ") || "Empty"}</div></div>
    <button class="r" onclick="delRoom('${r.id}')">Delete</button></div>`; }).join("") || '<p class="muted">No rooms yet. Add a room above, then pick it when adding students.</p>'}</div>`;
}
async function addRoom(){
  if(locked) return lockMsg();
  const name = val("rn"); if(!name) return alert("Enter a room name");
  const { error } = await sb.from("rooms").insert({ hostel_id:hostel.id, name, capacity:Number(val("rc"))||1 });
  if(error) return alert(error.message);
  await load(); render();
}
async function delRoom(id){ if(locked) return lockMsg(); if(!confirm("Delete this room?")) return; await sb.from("rooms").delete().eq("id",id); await load(); render(); }

function expensesView(){
  const list = expenses.filter(e=>e.spent_on.slice(0,7)==rmonth);
  return monthPicker() + `<div class="card"><h2>Add expense</h2>
  <div class="row"><select id="ec">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><input id="ea" type="number" placeholder="Amount"></div>
  <div class="row"><input id="en" placeholder="Note (optional)"><input id="ed" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
  <br><button onclick="addExpense()">Add expense</button></div>
  <div class="card"><h2>Expenses: ${money(sum(list.map(e=>e.amount)))}</h2>
  ${list.map(e=>`<div class="item"><div><b>${esc(e.category)}</b> - ${money(e.amount)}<div class="muted">${e.spent_on} ${esc(e.note)}</div></div>
  <button class="r" onclick="delExpense('${e.id}')">Delete</button></div>`).join("") || '<p class="muted">No expenses this month.</p>'}</div>`;
}
async function addExpense(){
  if(locked) return lockMsg();
  const amount = Number(val("ea")); if(!amount) return alert("Enter an amount");
  const { error } = await sb.from("expenses").insert({ hostel_id:hostel.id, category:val("ec"), amount, note:val("en"), spent_on:val("ed") || new Date().toISOString().slice(0,10) });
  if(error) return alert(error.message);
  await load(); render();
}
async function delExpense(id){ if(locked) return lockMsg(); if(!confirm("Delete this expense?")) return; await sb.from("expenses").delete().eq("id",id); await load(); render(); }

function reportView(){
  const md = dues.filter(d=>d.month==rmonth);
  const collected = sum(dues.filter(d=>d.paid && d.paid_on && d.paid_on.slice(0,7)==rmonth).map(d=>d.amount));
  const exp = expenses.filter(e=>e.spent_on.slice(0,7)==rmonth);
  const spent = sum(exp.map(e=>e.amount)), net = collected - spent;
  const by = {}; exp.forEach(e=>by[e.category]=(by[e.category]||0)+Number(e.amount));
  return monthPicker() + `<div class="card"><h2>Report for ${rmonth}</h2>
  <div class="item"><span>Fees billed</span><b>${money(sum(md.map(d=>d.amount)))}</b></div>
  <div class="item"><span>Fees collected (paid this month)</span><b style="color:var(--ok)">${money(collected)}</b></div>
  <div class="item"><span>Still pending (this month's dues)</span><b style="color:var(--bad)">${money(sum(md.filter(d=>!d.paid).map(d=>d.amount)))}</b></div>
  <div class="item"><span>Expenses</span><b>${money(spent)}</b></div>
  <div class="item"><span><b>Net profit</b></span><b style="color:${net>=0?"var(--ok)":"var(--bad)"}">${money(net)}</b></div></div>
  <div class="card"><h2>Expenses by category</h2>${Object.entries(by).map(([k,v])=>`<div class="item"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join("") || '<p class="muted">No expenses.</p>'}</div>`;
}

// ---- live updates: no reload needed ----
let rt = null, tmr = null, pend = false;
const isTyping = () => ["INPUT","SELECT"].includes(document.activeElement && document.activeElement.tagName);
async function refresh(){
  if(!hostel) return;
  await loadSub(); await load();
  if(isTyping()){ pend = true; return; }
  render();
}
function listen(){
  if(rt) return;
  rt = sb.channel("live").on("postgres_changes", { event:"*", schema:"public" }, () => { clearTimeout(tmr); tmr = setTimeout(refresh, 500); }).subscribe();
}
document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(); });
window.addEventListener("online", refresh);
document.addEventListener("focusout", () => setTimeout(() => { if(pend && !isTyping()){ pend = false; render(); } }, 300));

start();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
